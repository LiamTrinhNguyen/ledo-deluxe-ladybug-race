<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="How devices connect in Ludo Delux. Each device first trades a short handshake through the mailbox on Vercel, which stores the room list in Neon. Devices 1 and 2 connect first, then devices 3 and 4 join the same way. After that every device is linked directly to every other, and the host, device 1, sends the board to all of them. A Cloudflare relay carries a link only when no direct path exists." font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c140c"/></marker>
    <path id="hs1" d="M180,244 C180,195 400,205 400,152"/>
    <path id="hs2" d="M460,244 C460,195 450,205 450,152"/>
    <path id="hs3" d="M740,244 C740,195 490,205 490,152"/>
    <path id="hs4" d="M1020,244 C1020,195 540,205 540,152"/>
    <path id="store" d="M600,108 L700,108"/>
    <path id="l12" d="M198,426 C198,486 442,486 442,426"/>
    <path id="l23" d="M478,426 C478,486 722,486 722,426"/>
    <path id="l34" d="M758,426 C758,486 1002,486 1002,426"/>
    <path id="l13" d="M180,426 C180,553 740,553 740,426"/>
    <path id="l24" d="M460,426 C460,553 1020,553 1020,426"/>
    <path id="l14" d="M162,426 C162,626 1038,626 1038,426"/>
  </defs>
  <rect x="1" y="1" width="1198" height="648" rx="24" fill="#f4efe6" stroke="#d9cfbf" stroke-width="2"/>
  <text x="60" y="62" font-size="24" font-weight="700" fill="#1c140c">Ludo Delux</text>
  <text x="60" y="88" font-size="15" fill="#6b5f52">How devices connect and join a room</text>
  <circle cx="72" cy="150" r="12" fill="#e08a4f"/><text x="72" y="155" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="92" y="155" font-size="14" font-weight="600" fill="#1c140c">Handshake: each device asks</text>
  <text x="92" y="174" font-size="14" font-weight="600" fill="#1c140c">the mailbox who is in the room</text>
  <rect x="340" y="70" width="260" height="76" rx="14" fill="#1c140c"/>
  <text x="470" y="104" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Vercel</text>
  <text x="470" y="127" font-size="13" fill="#d9cfbf" text-anchor="middle">mailbox · /api/rtc</text>
  <use href="#store" fill="none" stroke="#1c140c" stroke-width="2.5" marker-end="url(#tip)"/>
  <text x="650" y="98" font-size="12" fill="#6b5f52" text-anchor="middle">stores</text>
  <rect x="700" y="70" width="260" height="76" rx="14" fill="#ffffff" stroke="#1c140c" stroke-width="2.5"/>
  <text x="830" y="104" font-size="20" font-weight="700" fill="#1c140c" text-anchor="middle">Neon</text>
  <text x="830" y="127" font-size="13" fill="#6b5f52" text-anchor="middle">room list · cleared in 60 s</text>
  <use href="#hs1" fill="none" stroke="#1c140c" stroke-width="2.2" marker-start="url(#tip)" marker-end="url(#tip)"/>
  <use href="#hs2" fill="none" stroke="#1c140c" stroke-width="2.2" marker-start="url(#tip)" marker-end="url(#tip)"/>
  <use href="#hs3" fill="none" stroke="#1c140c" stroke-width="2.2" marker-start="url(#tip)" marker-end="url(#tip)"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.25;0.25;1;1" keyTimes="0;0.02;0.30;0.36;1"/></use>
  <use href="#hs4" fill="none" stroke="#1c140c" stroke-width="2.2" marker-start="url(#tip)" marker-end="url(#tip)"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.25;0.25;1;1" keyTimes="0;0.02;0.30;0.36;1"/></use>
  <use href="#l23" fill="none" stroke="#8d8072" stroke-width="2" stroke-linecap="round"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.15;0.15;1;1" keyTimes="0;0.02;0.56;0.60;1"/></use>
  <use href="#l34" fill="none" stroke="#8d8072" stroke-width="2" stroke-linecap="round"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.15;0.15;1;1" keyTimes="0;0.02;0.56;0.60;1"/></use>
  <use href="#l24" fill="none" stroke="#8d8072" stroke-width="2" stroke-linecap="round"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.15;0.15;1;1" keyTimes="0;0.02;0.56;0.60;1"/></use>
  <use href="#l12" fill="none" stroke="#1c140c" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.15;0.15;1;1" keyTimes="0;0.02;0.22;0.26;1"/></use>
  <use href="#l13" fill="none" stroke="#1c140c" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.15;0.15;1;1" keyTimes="0;0.02;0.56;0.60;1"/></use>
  <use href="#l14" fill="none" stroke="#1c140c" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-opacity" dur="14s" repeatCount="indefinite" values="1;0.15;0.15;1;1" keyTimes="0;0.02;0.56;0.60;1"/></use>
  <g>
    <rect x="122" y="250" width="116" height="170" rx="22" fill="#ffffff" stroke="#1c140c" stroke-width="3"/>
    <rect x="160" y="260" width="40" height="7" rx="3.5" fill="#1c140c"/>
    <circle cx="180" cy="292" r="11" fill="#d64545"/>
    <text x="180" y="328" font-size="15" font-weight="700" fill="#1c140c" text-anchor="middle">Device 1</text>
    <text x="180" y="347" font-size="12" fill="#6b5f52" text-anchor="middle">host</text>
    <rect x="161" y="362" width="38" height="38" rx="9" fill="#f4efe6" stroke="#1c140c" stroke-width="2"/>
    <circle cx="171" cy="372" r="3" fill="#1c140c"/>
    <circle cx="189" cy="390" r="3" fill="#1c140c"/>
    <circle cx="180" cy="381" r="3" fill="#1c140c"/>
    <circle cx="189" cy="372" r="3" fill="#1c140c"/>
    <circle cx="171" cy="390" r="3" fill="#1c140c"/>
  </g>
  <g>
    <rect x="402" y="250" width="116" height="170" rx="22" fill="#ffffff" stroke="#1c140c" stroke-width="3"/>
    <rect x="440" y="260" width="40" height="7" rx="3.5" fill="#1c140c"/>
    <circle cx="460" cy="292" r="11" fill="#3d8c4a"/>
    <text x="460" y="328" font-size="15" font-weight="700" fill="#1c140c" text-anchor="middle">Device 2</text>
    <text x="460" y="347" font-size="12" fill="#6b5f52" text-anchor="middle">guest</text>
    <rect x="441" y="362" width="38" height="38" rx="9" fill="#f4efe6" stroke="#1c140c" stroke-width="2"/>
    <circle cx="451" cy="372" r="3" fill="#1c140c"/>
    <circle cx="469" cy="390" r="3" fill="#1c140c"/>
    <circle cx="460" cy="381" r="3" fill="#1c140c"/>
  </g>
  <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0.25;0.25;1;1" keyTimes="0;0.02;0.30;0.36;1"/>
    <rect x="682" y="250" width="116" height="170" rx="22" fill="#ffffff" stroke="#1c140c" stroke-width="3"/>
    <rect x="720" y="260" width="40" height="7" rx="3.5" fill="#1c140c"/>
    <circle cx="740" cy="292" r="11" fill="#e2b15a"/>
    <text x="740" y="328" font-size="15" font-weight="700" fill="#1c140c" text-anchor="middle">Device 3</text>
    <text x="740" y="347" font-size="12" fill="#6b5f52" text-anchor="middle">joins later</text>
    <rect x="721" y="362" width="38" height="38" rx="9" fill="#f4efe6" stroke="#1c140c" stroke-width="2"/>
    <circle cx="731" cy="372" r="3" fill="#1c140c"/>
    <circle cx="749" cy="390" r="3" fill="#1c140c"/>
    <circle cx="740" cy="381" r="3" fill="#1c140c"/>
    <circle cx="749" cy="372" r="3" fill="#1c140c"/>
    <circle cx="731" cy="390" r="3" fill="#1c140c"/>
  </g>
  <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0.25;0.25;1;1" keyTimes="0;0.02;0.30;0.36;1"/>
    <rect x="962" y="250" width="116" height="170" rx="22" fill="#ffffff" stroke="#1c140c" stroke-width="3"/>
    <rect x="1000" y="260" width="40" height="7" rx="3.5" fill="#1c140c"/>
    <circle cx="1020" cy="292" r="11" fill="#3a7bd5"/>
    <text x="1020" y="328" font-size="15" font-weight="700" fill="#1c140c" text-anchor="middle">Device 4</text>
    <text x="1020" y="347" font-size="12" fill="#6b5f52" text-anchor="middle">joins later</text>
    <rect x="1001" y="362" width="38" height="38" rx="9" fill="#f4efe6" stroke="#1c140c" stroke-width="2"/>
    <circle cx="1011" cy="372" r="3" fill="#1c140c"/>
    <circle cx="1029" cy="390" r="3" fill="#1c140c"/>
    <circle cx="1020" cy="381" r="3" fill="#1c140c"/>
  </g>
  <circle cx="318" cy="612" r="12" fill="#e08a4f"/><text x="318" y="617" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="338" y="617" font-size="14" font-weight="600" fill="#1c140c">Realtime: every device links to every other. The host sends the board to all.</text>
  <text x="600" y="637" font-size="12" fill="#6b5f52" text-anchor="middle">A Cloudflare relay carries a link only when no direct path exists.</text>
  <!-- Moving dots. One 14 second loop. -->
  <!-- Devices 1 and 2: handshake, then their link opens -->
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.030;0.090;1"><mpath href="#hs1"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.030;0.038;0.082;0.090;1"/>
  </circle>
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.040;0.100;1"><mpath href="#hs2"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.040;0.048;0.092;0.100;1"/>
  </circle>
  <circle r="6" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.100;0.130;1"><mpath href="#store"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.100;0.108;0.122;0.130;1"/>
  </circle>
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.130;0.190;1"><mpath href="#hs1"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.130;0.138;0.182;0.190;1"/>
  </circle>
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.140;0.200;1"><mpath href="#hs2"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.140;0.148;0.192;0.200;1"/>
  </circle>
  <circle r="8" fill="#d64545" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.240;0.300;1"><mpath href="#l12"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.240;0.248;0.292;0.300;1"/>
  </circle>
  <!-- Devices 3 and 4 join: the same handshake -->
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.370;0.430;1"><mpath href="#hs3"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.370;0.378;0.422;0.430;1"/>
  </circle>
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.380;0.440;1"><mpath href="#hs4"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.380;0.388;0.432;0.440;1"/>
  </circle>
  <circle r="6" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.440;0.470;1"><mpath href="#store"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.440;0.448;0.462;0.470;1"/>
  </circle>
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.470;0.530;1"><mpath href="#hs3"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.470;0.478;0.522;0.530;1"/>
  </circle>
  <circle r="7" fill="#e08a4f" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.480;0.540;1"><mpath href="#hs4"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.480;0.488;0.532;0.540;1"/>
  </circle>
  <!-- The host sends the board to everyone -->
  <circle r="8" fill="#d64545" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.610;0.700;1"><mpath href="#l12"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.610;0.618;0.692;0.700;1"/>
  </circle>
  <circle r="8" fill="#d64545" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.610;0.700;1"><mpath href="#l13"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.610;0.618;0.692;0.700;1"/>
  </circle>
  <circle r="8" fill="#d64545" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.610;0.700;1"><mpath href="#l14"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.610;0.618;0.692;0.700;1"/>
  </circle>
  <!-- Device 3 sends its move to the host -->
  <circle r="8" fill="#e2b15a" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0;0.730;0.810;1"><mpath href="#l13"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.730;0.738;0.802;0.810;1"/>
  </circle>
  <!-- The host sends the new board to everyone -->
  <circle r="8" fill="#d64545" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.840;0.930;1"><mpath href="#l12"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.840;0.848;0.922;0.930;1"/>
  </circle>
  <circle r="8" fill="#d64545" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.840;0.930;1"><mpath href="#l13"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.840;0.848;0.922;0.930;1"/>
  </circle>
  <circle r="8" fill="#d64545" stroke="#ffffff" stroke-width="2" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.840;0.930;1"><mpath href="#l14"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.840;0.848;0.922;0.930;1"/>
  </circle>
